# GitHub Pages публікує ВЕСЬ корінь гілки. Через це під прямими URL лежали
# файли, яким там не місце: crm_script.js (ID таблиць, _locPassword,
# MGMT_FALLBACK, ПІБ співробітниць із датами прийому) і робочі .md.
# Фронт від них не залежить — у коді немає жодного посилання, лише згадки
# в коментарях та інструкція для людини «відкрийте crm_script.js з репозиторію».
#
# Два незалежні запобіжники: сам файл переїхав у теку з підкресленням
# (Jekyll такі теки не копіює за замовчуванням) + явний exclude нижче.
exclude:
  - _backend
  - crm_script.js
  - "*.md"
  - .claude
  - .DS_Store
