<html lang="uk">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#FF6B35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{--b:#2563eb;--g:#16a34a;--r:#dc2626;--o:#ea580c;--mut:#94a3b8;--bg:#f1f5f9;--line:#e2e8f0;--dark:#1e293b;--gray:#64748b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--dark);font-size:14px}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .top h1{font-size:18px;margin:0;font-weight:800}
  .sp{flex:1}
  select,input,button{font:inherit}
  .btn{border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;color:#fff;background:var(--b)}
  .btn.g{background:var(--g)} .btn.sec{background:#fff;color:var(--dark);border:1px solid var(--line)} .btn:disabled{opacity:.5;cursor:default}
  .flt{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .mnav{display:flex;align-items:center;gap:6px}
  .mnav b{min-width:130px;text-align:center}
  .wrap{padding:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .card .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .hd h3{margin:0;font-size:15px}
  .muted{color:var(--gray);font-size:12px}
  .tblwrap{overflow:auto;max-height:72vh}
  table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
  table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
  table.grid thead th{position:sticky;top:0;z-index:6;background:#f8fafc;text-align:center;padding:4px 3px;font-weight:700;white-space:nowrap}
  table.grid thead th.we{background:#eef1f5;color:var(--mut)}
  table.grid td.kid,table.grid th.kidh{position:sticky;left:0;z-index:5;background:#fff;text-align:left;padding:4px 8px;min-width:180px;max-width:180px;border-right:2px solid var(--line)}
  table.grid thead th.kidh{z-index:8;background:#f8fafc}
  table.grid td.kid small{color:var(--gray);display:block;font-size:10px}
  td.tot,th.toth{position:sticky;right:0;z-index:5;background:#fff;text-align:right;padding:4px 8px;min-width:80px;font-weight:800;border-left:2px solid var(--line)}
  thead th.toth{z-index:8;background:#f8fafc}
  td.cell{padding:2px;text-align:center;min-width:74px}
  td.cell.we{background:#f6f8fa}
  .tg{display:inline-block;min-width:20px;padding:2px 4px;margin:1px;border:1px solid var(--line);border-radius:6px;font-size:10px;font-weight:800;color:var(--gray);cursor:pointer;user-select:none;line-height:1.2}
  .tg.on{color:#fff;border-color:transparent}
  .we .tg{opacity:.3;pointer-events:none}
  tbody tr:nth-child(even) td.kid{background:#fbfcfe}
  .prices{padding:12px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .prices .pit{display:flex;flex-direction:column;gap:3px}
  .prices label{font-size:12px;color:var(--gray)}
  .prices input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
  .foot{padding:9px 14px;font-weight:800;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.show{display:flex}
  .mcard{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;opacity:0;transition:.2s;pointer-events:none;font-weight:600}
  .toast.show{opacity:1}
  .empty{padding:40px;text-align:center;color:var(--gray)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dark)}
  .legend b{display:inline-block;padding:1px 6px;border-radius:6px;margin-right:3px}
  table.grid td.kid{white-space:nowrap}
  table.grid td.kid small{color:var(--gray);font-size:10px}
  table.grid td.cell{padding:2px 3px;text-align:center;white-space:nowrap}
  th.dcol small{color:var(--mut);font-weight:600}
  .tgb{display:flex;flex-direction:column;align-items:center;gap:2px}
  .tgr{display:flex;justify-content:center;gap:3px}
  .tg{display:inline-block;font-size:19px;line-height:28px;height:28px;min-width:28px;text-align:center;vertical-align:middle;padding:0 1px;margin:1px;border:1px solid transparent;border-radius:7px;cursor:pointer;opacity:.28;filter:grayscale(1)}
  .tg:hover{opacity:.6}
  .tg.on{opacity:1;filter:none}
</style>

<body>
<div class="top">
  <h1>🍽 Харчування</h1>
  <span id="syncStatus" style="font-size:12px"></span>
  <select id="locSel" class="flt"></select>
  <select id="clsSel" class="flt" title="Клас"></select>
  <div class="mnav">
    <button class="btn sec" id="mPrev">◀</button><b id="mLbl">—</b><button class="btn sec" id="mNext">▶</button>
  </div>
  <span class="sp"></span>
  <button class="btn sec" id="refreshBtn">🔄</button>
  <button class="btn" id="saveBtn" disabled>💾 Зберегти</button>
  <button class="btn g" id="exportBtn">📤 Експорт у Payment</button>
</div>
<div class="wrap" id="main"><div class="empty">Завантаження…</div></div>

<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>
<div class="toast" id="toast"></div>

<script>
var CFG = { SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyTSUVlaN4-PpXe47zCSmhVs0Qxy1FDXG_XsB4zcKNpqBxdhDtS9ibM4YFGkGjmPQDFWQ/exec' };
var MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
var WD = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
var TG_COLORS = ['#2563eb','#ea580c','#16a34a','#7c3aed','#db2777'];
var S = { user:null, loc:'', y:0, m:0, cat:[], tabs:[], activeTab:0, kids:[], classes:[], classFilter:null, marks:{}, orig:{}, clients:null };

// ── AUTH (shared session) ──
var SESSION_KEY='mkids_session', SESSION_TTL_MS = 7 * 24 * 3600 * 1000;

/* v7.151 токен-авторизація: ЄДИНИЙ перехоплювач fetch — додає токен у КОЖЕН запит до бекенду
   (GET -> &token=, POST -> у тіло) і ловить відмову code:'AUTH' (сесія протухла) -> логін.
   Ідемпотентний: повторне підключення нічого не робить. Усі опції захищені від undefined. */
(function(){
  if (window.__mkFetchTokenPatched) return; window.__mkFetchTokenPatched = true;
  var _of = window.fetch.bind(window);
  function _tok(){ try { return (JSON.parse(localStorage.getItem('mkids_session')||'null')||{}).token || ''; } catch(e){ return ''; } }
  /* Сесія протухла -> чистимо і кидаємо на логін. Спрацьовує рівно один раз.
     Відмову «Доступ лише до своєї локації» НЕ чіпаємо — то не протухла сесія, а брак прав. */
  function _kick(){
    if (window.__mkAuthKicked) return; window.__mkAuthKicked = true;
    try { localStorage.removeItem('mkids_session'); } catch(_e){}
    try { alert('Сесія закінчилась, увійдіть знову'); } catch(_e){}
    try { window.location.href = 'index.html'; } catch(_e){}
  }
  /* Відповідь Apps Script приходить БЕЗ Content-Length (chunked), тож розмір наперед невідомий:
     читаємо лише ПЕРШИЙ чанк клона. Оригінал не чіпаємо, виклик не блокуємо. */
  function _watch(r){
    try {
      var c = r.clone();
      if (!c.body || !c.body.getReader) return r;
      var rd = c.body.getReader();
      rd.read().then(function(res){
        try {
          if (res && res.value){
            var s = new TextDecoder('utf-8').decode(res.value);
            if (s.indexOf('"AUTH"') >= 0 && s.indexOf('Не авторизовано') >= 0) _kick();
          }
        } catch(_e){}
        try { rd.cancel(); } catch(_e){}
      }, function(){ try { rd.cancel(); } catch(_e){} });
    } catch(_e){}
    return r;
  }
  window.fetch = function(input, init){
    var url = '';
    try { url = (typeof input === 'string') ? input : (input && input.url) || ''; } catch(_e){}
    if (url.indexOf('script.google.com') < 0) return _of(input, init);   // сторонні запити не чіпаємо
    try {
      var t = _tok();
      if (t){
        init = init || {};
        var m = ((init && init.method) || 'GET').toUpperCase();
        if (m === 'POST'){
          if (typeof init.body === 'string'){ try { var b = JSON.parse(init.body); if (b && b.token == null){ b.token = t; init.body = JSON.stringify(b); } } catch(_e){} }
        } else if (typeof input === 'string' && !/[?&]token=/.test(input)){
          input = input + (input.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(t);
        }
      }
    } catch(_e){}
    return _of(input, init).then(_watch);
  };
})();

var NETWORK_ROLES=['hr','cfo','ceo','cco','coo','rnd_director','hr_trainer','legal','cmo'];
function readSession(){ try{ var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
  if(!s||!s.user||!s.t) return null; if(typeof s.user.role!=='string') return null; if(Date.now()-s.t>SESSION_TTL_MS) return null;
  s.user.role=String(s.user.role||'').toLowerCase().trim();
  if(NETWORK_ROLES.indexOf(s.user.role)!==-1 && s.user.loc!==''){ s.user.origLoc=s.user.loc; s.user.loc=''; }
  return s.user; }catch(e){ return null; } }
function isHR(){ return S.user && NETWORK_ROLES.indexOf(S.user.role)!==-1; }
function goLogin(){ document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:system-ui"><div style="font-size:44px">🔒</div><h2>Потрібно увійти</h2><p style="color:#64748b">Відкрийте головний застосунок і увійдіть.</p><a href="index.html" style="display:inline-block;margin-top:10px;padding:12px 20px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:700">Увійти →</a></div>'; }

// ── API ──
async function _fetch(url,opts){ var c=new AbortController(); var t=setTimeout(function(){c.abort();},45000);
  try{ var o=Object.assign({redirect:'follow'},opts||{}); o.signal=c.signal; var r=await fetch(url,o); clearTimeout(t); return r; }
  catch(e){ clearTimeout(t); throw e; } }
// v7.105: cloudFetch — таймаут 45с + 2 повтори (1с,3с) лише на мережевий збій. ТІЛЬКИ для читань (GET); записи (apiPost) не ретраїмо.
var _CF_RETRIES=[1000,3000]; function _cfSleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* v7.110 токен-авторизація: токен у localStorage['mkids_session'].token; додаємо в КОЖЕН запит (GET-param / POST-body). */
function _authTok(){ try { return (JSON.parse(localStorage.getItem('mkids_session')||'null')||{}).token || ''; } catch(e){ return ''; } }
function _tokUrl(u){ var t=_authTok(); if(!t) return u; return /[?&]token=/.test(u) ? u : (u + (u.indexOf('?')>=0?'&':'?') + 'token=' + encodeURIComponent(t)); }
function _tokBody(b){ try{ if(b && typeof b==='object' && b.token==null) b.token=_authTok(); }catch(e){} return b; }
async function cloudFetch(url,opts){ opts=opts||{}; url=_tokUrl(url); var tmo=opts.timeoutMs||45000, del=opts.retries||_CF_RETRIES;
  var init=Object.assign({redirect:'follow'},opts.fetch||{}), n=del.length+1, last;
  for(var i=0;i<n;i++){ var c=new AbortController(); var t=setTimeout(function(){try{c.abort();}catch(_){}},tmo);
    try{ var r=await fetch(url,Object.assign({},init,{signal:c.signal})); clearTimeout(t);
      if(r&&r.status>=500&&i<n-1){ await _cfSleep(del[i]); continue; } // 5xx/SW-офлайн(503) → повтор
      return r; }
    catch(e){ clearTimeout(t); last=e; if(i<n-1){ await _cfSleep(del[i]); continue; } throw last; } } throw last; }
var _CLAB={ sync:{t:'☁️ Синхронізація…',c:'#e67e22'}, ok:{t:'☁️ Синхронізовано',c:'#16a34a'}, err:{t:'⚠️ Помилка хмари',c:'#dc2626'}, none:{t:'',c:'#94a3b8'} };
function setCloudStatus(state,reason){ var el=document.getElementById('syncStatus'); if(!el)return; var s=_CLAB[state]||_CLAB.none;
  el.textContent=(state==='err'&&reason)?(s.t+': '+reason):s.t; el.style.color=s.c; el.title=(state==='err'&&reason)?('Не завантажилось: '+reason):''; } // v7.127: причина в тексті
async function apiGet(action,qs){ var r=await cloudFetch(CFG.SCRIPT_URL+'?action='+action+(qs?'&'+qs:'')); return r.json(); }
async function apiPost(body){ var r=await _fetch(CFG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(_tokBody(body))});
  var txt=await r.text(); try{ return JSON.parse(txt); }catch(_){ return {ok:true,_assumed:true}; } }
function enc(s){ return encodeURIComponent(s); }

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function fmtG(n){ return (Number(n)||0).toLocaleString('uk-UA')+' ₴'; }
function shortLabel(name){ var w=String(name||'').trim().split(/\s+/); return (w.map(function(x){return (x[0]||'').toUpperCase();}).join('').slice(0,3))||'?'; }
function markKey(child,date,itemId){ return child+'||'+date+'||'+itemId; }

// ── Завантаження локацій (школи з харчуванням) ──
async function init(){
  try{
    S.user=readSession(); if(!S.user){ goLogin(); return; }
    var now=new Date(); S.y=now.getFullYear(); S.m=now.getMonth()+1;
    document.getElementById('mLbl').textContent=MONTHS[S.m-1]+' '+S.y;   // місяць видно одразу
    wireTop();
    // 1) список шкіл із getLocations
    var schools=[];
    try{ var jl=await apiGet('getLocations'); var arr=(jl&&jl.data)||(Array.isArray(jl)?jl:[])||[];
      arr.forEach(function(l){ var typ=String(l.typ||'').trim(), loc=String(l.loc||'').trim();
        if(typ==='Школа' || /школа/i.test(loc)) schools.push(loc); });
    }catch(e){ console.warn('[meals] getLocations:', e&&e.message); }
    if(!isHR()){ var my=String(S.user.origLoc||S.user.loc||'').trim(); var f=schools.filter(function(l){return l===my;}); schools=(f.length||!my)?f:[my]; }
    if(!schools.length){ document.getElementById('main').innerHTML='<div class="empty">Немає доступних шкіл для вашого доступу.</div>'; return; }
    // 2) паралельна перевірка «ввімкнено» (є каталог); якщо жодної — фолбек показуємо всі, гейт у loadAll
    var checks=await Promise.all(schools.map(function(loc){
      return apiGet('getMealCatalog','loc='+enc(loc)).then(function(c){ return (c&&c.ok&&c.items&&c.items.length)?loc:null; }).catch(function(){ return null; });
    }));
    var enabled=checks.filter(Boolean); var list=enabled.length?enabled:schools;
    document.getElementById('locSel').innerHTML=list.map(function(l){return '<option>'+esc(l)+'</option>';}).join('');
    S.loc=list[0];
    await loadAll();
  }catch(e){ document.getElementById('main').innerHTML='<div class="empty">Помилка ініціалізації: '+esc(e&&e.message||e)+'</div>'; console.error('[meals] init', e); }
}
function wireTop(){
  document.getElementById('locSel').onchange=function(){ if(!confirmLoss())return; S.loc=this.value; S.classFilter=null; loadAll(); };
  document.getElementById('clsSel').onchange=function(){ S.classFilter=this.value; render(); };
  document.getElementById('mPrev').onclick=function(){ if(!confirmLoss())return; S.m--; if(S.m<1){S.m=12;S.y--;} loadAll(); };
  document.getElementById('mNext').onclick=function(){ if(!confirmLoss())return; S.m++; if(S.m>12){S.m=1;S.y++;} loadAll(); };
  document.getElementById('refreshBtn').onclick=function(){ if(!confirmLoss())return; loadAll(); };
  document.getElementById('saveBtn').onclick=saveMarks;
  document.getElementById('exportBtn').onclick=doExportPreview;
  document.getElementById('mcard').addEventListener('click',function(e){ if(e.target.dataset.close) closeModal(); });
}
function confirmLoss(){ return !dirtyCount() || confirm('Є незбережені відмітки. Втратити їх?'); }

// ── Завантаження місяця ──
async function loadAll(){
  document.getElementById('mLbl').textContent=MONTHS[S.m-1]+' '+S.y;
  document.getElementById('main').innerHTML='<div class="empty">Завантаження…</div>';
  setCloudStatus('sync');
  try{
    var cat=await apiGet('getMealCatalog','loc='+enc(S.loc));
    S.cat=((cat&&cat.items)||[]).filter(function(x){return x.active;}).map(function(x,i){ x.label=shortLabel(x.name); x.color=TG_COLORS[i%TG_COLORS.length]; return x; });
    if(!S.cat.length){ document.getElementById('main').innerHTML='<div class="empty">Харчування не налаштоване для «'+esc(S.loc)+'».<br><span class="muted">Потрібні активні позиції в каталозі та 7-колонкова розкладка Payment.</span></div>'; return; }
    if(!S.clients){ var cl=await apiGet('getClients'); S.clients=(cl&&cl.data)||(Array.isArray(cl)?cl:[])||[]; }
    S.kids=S.clients.filter(function(r){ return String(r['Локація']||'')===S.loc && String(r['Статус']||'').toLowerCase()==='active'; })
      .map(function(r){ return {name:String(r['ПІБ дитини']||'').trim(), group:String(r['Група']||'').trim()}; })
      .filter(function(k){return k.name;})
      .sort(function(a,b){ return (a.group+a.name).localeCompare(b.group+b.name,'uk'); });
    var mk=await apiGet('getMealMarks','loc='+enc(S.loc)+'&year='+S.y+'&month='+S.m);
    S.marks={}; (mk.marks||[]).forEach(function(m){ S.marks[markKey(m.child,m.date,m.itemId)]=true; });
    S.orig=Object.assign({},S.marks);
    // класи (групи школи)
    var gset={}; S.kids.forEach(function(k){ if(k.group) gset[k.group]=1; });
    S.classes=Object.keys(gset).sort(function(a,b){return a.localeCompare(b,'uk');});
    var myCls=teacherClass();
    if(myCls){ S.classFilter=myCls; }
    else if(S.classFilter==null || (S.classFilter!=='__all__' && S.classes.indexOf(S.classFilter)<0)){ S.classFilter=S.classes[0]||'__all__'; }
    // вкладки з каталогу (по одній на вид)
    S.tabs=S.cat.map(function(x){ return {id:x.id, name:x.name, price:x.price, icon:iconFor(x.name), color:x.color}; });
    if(S.activeTab==null || (S.activeTab!=='all' && S.activeTab>=S.tabs.length)) S.activeTab=0;
    fillClassSel();
    render();
    setCloudStatus('ok');
  }catch(e){ setCloudStatus('err','каталог/діти харчування'); document.getElementById('main').innerHTML='<div class="empty">Помилка завантаження: '+esc(e&&e.message||e)+'</div>'; }
}

function monthDays(){ var days=[], dim=new Date(S.y,S.m,0).getDate();
  for(var d=1;d<=dim;d++){ var dow=new Date(S.y,S.m-1,d).getDay(); if(dow===0||dow===6) continue;   // лише будні (Сб/Нд прибрано)
    days.push({d:d, iso:S.y+'-'+('0'+S.m).slice(-2)+'-'+('0'+d).slice(-2), dow:dow}); }
  return days; }
function visKids(){ return (S.classFilter==='__all__') ? S.kids : S.kids.filter(function(k){return k.group===S.classFilter;}); }
function iconFor(name){ var n=String(name||'').toLowerCase();
  if(n.indexOf('вечер')>=0) return '🍛'; if(n.indexOf('кейтер')>=0) return '🥡'; if(n.indexOf('шкіл')>=0) return '🍲'; return '🍽'; }
function priceOf(id){ var p=S.cat.filter(function(x){return x.id===id;})[0]; return p?p.price:0; }
function teacherClass(){ if(isHR()||String(S.user.role||'')==='director') return ''; return String(S.user.group||S.user.class||'').trim()||''; }
function fillClassSel(){ var sel=document.getElementById('clsSel'); if(!sel) return; var locked=!!teacherClass();
  var opts=''; if(isHR()) opts+='<option value="__all__"'+(S.classFilter==='__all__'?' selected':'')+'>Усі класи</option>';
  opts+=S.classes.map(function(c){return '<option value="'+esc(c)+'"'+(c===S.classFilter?' selected':'')+'>'+esc(c)+'</option>';}).join('');
  sel.innerHTML=opts; sel.disabled=locked; sel.style.display=S.classes.length?'':'none'; }

// Обіди (шкільний/кейтеринг) — верхній рядок; вечеря — нижній.
function splitViews(){ var top=[],bot=[]; S.tabs.forEach(function(t){ (/обід|обед/i.test(t.name)?top:bot).push(t); }); if(!top.length){ top=S.tabs.slice(0,2); bot=S.tabs.slice(2); } return {top:top,bot:bot}; }
// Обіди взаємовиключні: активний лише один із цих id на день.
function lunchIds(){ return S.tabs.filter(function(t){return /обід|обед/i.test(t.name);}).map(function(t){return t.id;}); }
function isLunch(id){ return lunchIds().indexOf(id)>=0; }
// act = 'cell' — індивідуальне відмічання (масового немає).
function tgBlock(act, attrs, isOn){
  var sv=splitViews();
  function one(t){ var on=isOn(t);
    return '<span class="tg'+(on?' on':'')+'" data-act="'+act+'" data-it="'+t.id+'" '+attrs(t)+' style="'+(on?'background:'+t.color+';border-color:'+t.color:'')+'" title="'+esc(t.name)+'">'+t.icon+'</span>'; }
  function row(list){ return list.length ? '<div class="tgr">'+list.map(one).join('')+'</div>' : ''; }
  return '<div class="tgb">'+row(sv.top)+row(sv.bot)+'</div>';   // колонка: два рядки (2+1)
}
function render(){
  if(!S.tabs || !S.tabs.length){ document.getElementById('main').innerHTML='<div class="empty">Немає активних позицій у каталозі.</div>'; return; }
  var legend='<div class="legend">'+S.tabs.map(function(t){return '<span><b style="background:'+t.color+'">'+t.icon+'</b> '+esc(t.name)+' · '+fmtG(t.price)+'</span>';}).join('')+'</div>';
  document.getElementById('main').innerHTML=
    '<div class="card"><div class="hd" style="gap:10px">'+legend+'</div>'+
    '<div class="tblwrap"><table class="grid"><thead id="gHead"></thead><tbody id="gBody"></tbody></table></div>'+
    '<div class="foot"><div>По класу: <span id="clsTot">0</span></div><div>По школі: <span id="schoolTot">0</span></div><div class="muted" id="dirtyLbl"></div></div></div>'+
    priceEditor();
  document.getElementById('savePricesBtn').onclick=savePrices;
  renderHead(); renderBody(); wireGrid(); recalc();
}
function renderHead(){
  var ths=monthDays().map(function(x){ return '<th class="dcol">'+x.d+' <small>'+WD[x.dow]+'</small></th>'; }).join('');
  document.getElementById('gHead').innerHTML='<tr><th class="kidh">Дитина</th>'+ths+'<th class="toth">Σ міс</th></tr>';
}
function renderBody(){
  var days=monthDays(), kids=visKids();
  var html=kids.map(function(k,ci){
    var cells=days.map(function(x){
      var tgs=tgBlock('cell', function(t){return 'data-ci="'+ci+'" data-d="'+x.iso+'"';}, function(t){ return !!S.marks[markKey(k.name,x.iso,t.id)]; });
      return '<td class="cell">'+tgs+'</td>';
    }).join('');
    return '<tr><td class="kid"><b>'+esc(k.name)+'</b> <small>'+esc(k.group)+'</small></td>'+cells+'<td class="tot" data-kt="'+ci+'">0</td></tr>';
  }).join('');
  document.getElementById('gBody').innerHTML=html || '<tr><td class="kid" colspan="99">Немає дітей у класі</td></tr>';
}
function refresh(){ renderHead(); renderBody(); recalc(); }
function wireGrid(){
  document.getElementById('gBody').onclick=function(e){ var t=e.target.closest('.tg'); if(!t || t.dataset.act!=='cell') return;
    toggleMark(visKids()[+t.dataset.ci].name, t.dataset.d, +t.dataset.it); refresh();   // лише ця дитина, цей день, ця позиція
  };
}
function toggleMark(child,iso,id){ var k=markKey(child,iso,id);
  if(S.marks[k]){ delete S.marks[k]; return; }                                   // активний → зняти
  S.marks[k]=true;
  if(isLunch(id)) lunchIds().forEach(function(oid){ if(oid!==id) delete S.marks[markKey(child,iso,oid)]; });   // ексклюзив обідів
}
function recalc(){
  var kids=visKids(), perKid={}, classTot=0, schoolTot=0;
  Object.keys(S.marks).forEach(function(k){ var p=k.split('||'); perKid[p[0]]=(perKid[p[0]]||0)+priceOf(+p[2]); schoolTot+=priceOf(+p[2]); });
  kids.forEach(function(k,ci){ var td=document.querySelector('td.tot[data-kt="'+ci+'"]'); var v=perKid[k.name]||0; if(td) td.textContent=fmtG(v); classTot+=v; });
  var ct=document.getElementById('clsTot'); if(ct) ct.textContent=fmtG(classTot);
  var st=document.getElementById('schoolTot'); if(st) st.textContent=fmtG(schoolTot);
  var dc=dirtyCount(); document.getElementById('saveBtn').disabled=!dc; document.getElementById('saveBtn').textContent='💾 Зберегти'+(dc?' ('+dc+')':'');
  var dl=document.getElementById('dirtyLbl'); if(dl) dl.textContent=dc?('Незбережених: '+dc):'Усе збережено';
}
function dirtyCount(){ var n=0; var seen={};
  Object.keys(S.marks).forEach(function(k){ if(!S.orig[k]) n++; seen[k]=1; });
  Object.keys(S.orig).forEach(function(k){ if(!S.marks[k]) n++; });
  return n; }

// ── Збереження (батч) ──
async function saveMarks(){
  var adds=[], rems=[];
  Object.keys(S.marks).forEach(function(k){ if(!S.orig[k]){ var p=k.split('||'); var kid=findKid(p[0]);
    var pos=S.cat.filter(function(x){return x.id===+p[2];})[0]||{};
    adds.push({date:p[1],child:p[0],group:kid?kid.group:'',itemId:+p[2],itemName:pos.name||'',price:pos.price||0}); } });
  Object.keys(S.orig).forEach(function(k){ if(!S.marks[k]){ var p=k.split('||'); rems.push({date:p[1],child:p[0],itemId:+p[2],remove:true}); } });
  var marks=adds.concat(rems); if(!marks.length){ toast('Немає змін'); return; }
  var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Збереження…';
  var res=await apiPost({action:'addMealMark',loc:S.loc,markedBy:(S.user.role||'')+' '+(S.user.origLoc||S.user.loc||''),marks:marks});
  if(res && res.ok){ S.orig=Object.assign({},S.marks); toast('Збережено: +'+(res.added||0)+' / −'+(res.removed||0)); recalc();
    btn.disabled=false; btn.textContent='💾 Зберегти';
    autoExportMeals(); }                                    // v7.108: одразу тихо в Payment (як додаткові)
  else { toast('Помилка: '+(res&&res.error||'?')); btn.disabled=false; }
}
// v7.108: тихий авто-експорт харчування у Payment ОДРАЗУ після збереження відміток — як у «Додаткових»
// (scheduleAutoExport). Без прев'ю. Ідемпотентно (base+newSum у журналі), захист закритих місяців — на
// боці бекенду (skippedClosed). Кнопка ручного експорту («📤 Експорт у Payment») лишається.
async function autoExportMeals(){
  try{
    if(typeof setCloudStatus==='function') setCloudStatus('sync','харчування→Payment');
    var w=await apiPost({action:'exportMealToPayments',loc:S.loc,year:S.y,dryRun:false});
    if(w && w.ok){
      if(w.totalAmount || w.updated) toast('📤 У Payment: '+fmtG(w.totalAmount||0)+' ('+(w.updated||0)+' рядків)');
      if(w.skippedClosed && w.skippedClosed.length) toast('Пропущено закриті: '+w.skippedClosed.map(function(m){return MONTHS[m-1];}).join(', '));
      if(typeof setCloudStatus==='function') setCloudStatus('ok');
    } else {
      if(typeof setCloudStatus==='function') setCloudStatus('err','експорт харчування');
      console.warn('[meals auto-export]', w && w.error);
    }
  }catch(e){
    if(typeof setCloudStatus==='function') setCloudStatus('err','експорт харчування');
    console.warn('[meals auto-export]', e && e.message || e);
  }
}
function findKid(name){ return S.kids.filter(function(k){return k.name===name;})[0]; }

// ── Ціни позицій ──
function priceEditor(){
  return '<div class="card"><div class="hd"><h3>💰 Ціни позицій</h3><span class="muted">'+esc(S.loc)+'</span></div>'+
    '<div class="prices">'+S.cat.map(function(p){ return '<div class="pit"><label><b style="background:'+p.color+';color:#fff;padding:1px 5px;border-radius:4px">'+esc(p.label)+'</b> '+esc(p.name)+'</label><input type="number" min="0" step="1" value="'+p.price+'" data-pid="'+p.id+'"></div>'; }).join('')+
    '<button class="btn" id="savePricesBtn">Зберегти ціни</button></div></div>';
}
async function savePrices(){
  var inputs=document.querySelectorAll('.prices input[data-pid]'); var changed=[];
  inputs.forEach(function(inp){ var id=+inp.dataset.pid; var p=S.cat.filter(function(x){return x.id===id;})[0]; var v=Number(inp.value);
    if(p && !isNaN(v) && v!==p.price) changed.push({id:id,name:p.name,price:v}); });
  if(!changed.length){ toast('Ціни без змін'); return; }
  for(var i=0;i<changed.length;i++){ await apiPost({action:'saveMealItem',loc:S.loc,id:changed[i].id,name:changed[i].name,price:changed[i].price,active:true}); }
  toast('Ціни оновлено ('+changed.length+')'); await loadAll();
}

// ── Експорт у Payment ──
async function doExportPreview(){
  if(dirtyCount()){ if(!confirm('Є незбережені відмітки — вони не потраплять в export. Продовжити?')) return; }
  openModal('<h3 style="margin:0 0 10px">📤 Експорт у Payment — прев\'ю</h3><div class="muted">Рахую…</div>');
  var res=await apiPost({action:'exportMealToPayments',loc:S.loc,year:S.y,dryRun:true});
  if(!res||!res.ok){ setModal('<h3>Помилка</h3><p>'+esc(res&&res.error||'?')+'</p><button class="btn sec" data-close="1">Закрити</button>'); return; }
  var rows=(res.perMonth||[]).filter(function(x){return x.sum||x.updated;}).map(function(x){return '<tr><td>'+MONTHS[x.month-1]+'</td><td style="text-align:right">'+x.updated+'</td><td style="text-align:right">'+fmtG(x.sum)+'</td></tr>';}).join('');
  var nf=(res.notFound||[]);
  var html='<h3 style="margin:0 0 8px">📤 Прев\'ю експорту · '+esc(S.loc)+' '+S.y+'</h3>'+
    '<div class="muted" style="margin-bottom:8px">Ціль: Бюджет-харчування · оновлено рядків: <b>'+res.updated+'</b> · сума: <b>'+fmtG(res.totalAmount)+'</b></div>'+
    (rows?'<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left">Місяць</th><th style="text-align:right">Дітей</th><th style="text-align:right">Сума</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="muted">Немає сум до запису.</p>')+
    (res.skippedClosed&&res.skippedClosed.length?'<p class="muted">Пропущено закриті місяці: '+res.skippedClosed.map(function(m){return MONTHS[m-1];}).join(', ')+'</p>':'')+
    (nf.length?'<p style="color:#dc2626">Не знайдено в Payment ('+nf.length+'): '+nf.slice(0,12).map(esc).join(', ')+(nf.length>12?'…':'')+'</p>':'')+
    '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn g" id="doWriteBtn">✅ Записати у Payment</button><button class="btn sec" data-close="1">Скасувати</button></div>';
  setModal(html);
  document.getElementById('doWriteBtn').onclick=async function(){ this.disabled=true; this.textContent='Запис…';
    var w=await apiPost({action:'exportMealToPayments',loc:S.loc,year:S.y,dryRun:false});
    if(w&&w.ok){ toast('Записано у Payment: '+fmtG(w.totalAmount)); closeModal(); } else { toast('Помилка: '+(w&&w.error||'?')); this.disabled=false; } };
}

// ── Modal ──
function openModal(html){ setModal(html); document.getElementById('modal').classList.add('show'); }
function setModal(html){ document.getElementById('mcard').innerHTML=html; }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') closeModal(); });

init();
</script>
</body>
