<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m.kids System — Звіт розсилок рахунків</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="m.kids System">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#27ae60;--red:#c0392b;--blue:#2980b9;--dark:#1a2332;--dark2:#2c3e50;
  --gray:#7f8c8d;--gray2:#bdc3c7;--bg:#f0f4f8;--white:#fff;--r:10px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);
  color:var(--dark2);font-size:14px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{font-size:24px;font-weight:900;color:var(--dark);flex:1;min-width:240px}
.hd-meta{font-size:12px;color:var(--gray);margin-top:3px;font-weight:500}
.btn{padding:10px 16px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--dark2);border:1.5px solid var(--gray2)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.fg select{padding:9px 12px;border:1.5px solid var(--gray2);border-radius:8px;font-size:14px;
  font-weight:600;background:#fff;color:var(--dark2);outline:none}
.card{background:var(--white);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--gray);border-bottom:2px solid var(--gray2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #eef2f6}
tr:hover td{background:#fafbfc}
td.num,th.num{text-align:right}
.pct{display:inline-block;min-width:46px;text-align:right;font-weight:700}
.pct.hi{color:var(--green)}.pct.mid{color:#e67e22}.pct.lo{color:var(--red)}
.bar{height:6px;border-radius:4px;background:#eef2f6;margin-top:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--green)}
tr.total td{font-weight:800;color:var(--dark);border-top:2px solid var(--gray2);background:#f4f7fa}
.err{background:#fdf2f2;border:1px solid #fca5a5;color:var(--red);padding:14px 18px;
  border-radius:var(--r);margin-bottom:18px;font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;padding:50px;
  flex-direction:column;gap:14px;color:var(--gray)}
.spinner{width:32px;height:32px;border:3px solid #e8ecf0;border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.empty{text-align:center;padding:30px;color:var(--gray)}
@media(max-width:600px){.hd h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div style="flex:1;min-width:240px">
      <h1>📊 Звіт розсилок рахунків</h1>
      <div class="hd-meta" id="meta">завантаження…</div>
    </div>
    <button class="btn btn-ghost" onclick="window.location.href='invoices.html'">← До рахунків</button>
  </div>

  <div id="errBox" class="err hidden"></div>

  <div class="filters">
    <div class="fg"><label>Місяць надсилання</label>
      <select id="fMonth"></select></div>
    <div class="fg"><label>Рік</label>
      <select id="fYear"></select></div>
    <button class="btn" onclick="loadReport()">🔄 Оновити</button>
  </div>

  <div class="card">
    <div id="repWrap"><div class="loading"><div class="spinner"></div><div>Завантаження…</div></div></div>
  </div>
</div>

<script>
'use strict';
/* v7.151 токен-авторизація: ЄДИНИЙ перехоплювач fetch — додає токен у КОЖЕН запит до бекенду
   (GET -> &token=, POST -> у тіло) і ловить відмову code:'AUTH' (сесія протухла) -> логін.
   Ідемпотентний: повторне підключення нічого не робить. Усі опції захищені від undefined. */
(function(){
  if (window.__mkFetchTokenPatched) return; window.__mkFetchTokenPatched = true;
  var _of = window.fetch.bind(window);
  function _tok(){ try { return (JSON.parse(localStorage.getItem('mkids_session')||'null')||{}).token || ''; } catch(e){ return ''; } }
  /* Сесія протухла -> чистимо і кидаємо на логін. Спрацьовує рівно один раз.
     Відмову «Доступ лише до своєї локації» НЕ чіпаємо — то не протухла сесія, а брак прав. */
  function _kick(){
    if (window.__mkAuthKicked) return; window.__mkAuthKicked = true;
    try { localStorage.removeItem('mkids_session'); } catch(_e){}
    try { alert('Сесія закінчилась, увійдіть знову'); } catch(_e){}
    try { window.location.href = 'index.html'; } catch(_e){}
  }
  /* Відповідь Apps Script приходить БЕЗ Content-Length (chunked), тож розмір наперед невідомий:
     читаємо лише ПЕРШИЙ чанк клона. Оригінал не чіпаємо, виклик не блокуємо. */
  function _watch(r){
    try {
      var c = r.clone();
      if (!c.body || !c.body.getReader) return r;
      var rd = c.body.getReader();
      rd.read().then(function(res){
        try {
          if (res && res.value){
            var s = new TextDecoder('utf-8').decode(res.value);
            if (s.indexOf('"AUTH"') >= 0 && s.indexOf('Не авторизовано') >= 0) _kick();
            /* v7.333: бекенд не прийняв ЦЕЙ токен (прострочений / чужий підпис) — один раз на перелогін.
               Запам'ятовуємо токен, щоб не зациклитись, якщо й новий раптом не прийметься. */
            else if (s.indexOf('"authStale"') >= 0){
              var _st = _tok(), _lastSt = ''; try { _lastSt = localStorage.getItem('mk_stale_tok') || ''; } catch(_e){}
              if (_st && _st !== _lastSt){ try { localStorage.setItem('mk_stale_tok', _st); } catch(_e){} _kick(); }
            }
          }
        } catch(_e){}
        try { rd.cancel(); } catch(_e){}
      }, function(){ try { rd.cancel(); } catch(_e){} });
    } catch(_e){}
    return r;
  }
  /* v7.288: порожній або прострочений токен у живій сесії → на логін одразу, а не
     тихе опитування щохвилини без токена (бейдж задач). Сесії без user.id
     (екран логіна, старі) не чіпаємо — їх ведуть readSession/_showStaleSession. */
  function _tokExpired(t){
    try {
      var dot = t.indexOf('.'); if (dot <= 0) return true;
      var p64 = t.slice(0, dot).replace(/-/g, '+').replace(/_/g, '/');
      while (p64.length % 4) p64 += '=';
      var pl = JSON.parse(decodeURIComponent(escape(atob(p64))));
      return !pl || !pl.exp || Date.now() > Number(pl.exp);
    } catch(_e){ return false; }   /* нечитабельний payload — хай вирішує бекенд */
  }
  function _checkTok(){
    var s; try { s = JSON.parse(localStorage.getItem('mkids_session') || 'null'); } catch(_e){ return true; }
    if (!s || !s.user || !(Number(s.user.id) > 0)) return true;
    var t = String(s.token || '');
    if (!t || _tokExpired(t)){ _kick(); return false; }
    return true;
  }
  // ── v7.403: stale-while-revalidate — дії, які можна віддавати з кешу (лише читання, важкі) ──
  var SWR_ACTIONS = {getPaymentsYearly:1, getPayments:1, getEmployees:1, getKomplektaciyaData:1, getGroupNorms:1,
    getLocationCapacity:1, getLocationCards:1, getSalaryOverview:1, getOpexOverview:1, getOverviewAnalytics:1,
    getVyhovatelRatings:1, getPredmetnyky:1, getPredSplits:1, getActivitiesCatalog:1, getAttendanceMarks:1,
    getDopMerges:1, getDopSplits:1, getSchoolRoster:1, getSalaryData:1, getOpexData:1, getCategoryAnalytics:1,
    getLeads:1, getEntryHistory:1, getInvoiceListData:1, getFillStatus:1, getClientMap:1, getUsers:1, getTasks:1,
    getMealCatalog:1, getMealMarks:1, cashList:1, getErrLog:1, getSalaryExtrasRows:1, getOpexContractors:1,
    getSalaryFopMap:1, getBdayStatus:1};
  function _swrKey(u){
    try { var s = JSON.parse(localStorage.getItem('mkids_session') || 'null'); var uid = s && s.user && s.user.id;
      if (!uid) return ''; return uid + '|' + u.replace(/([?&])token=[^&]*&?/, '$1').replace(/[?&]$/, ''); } catch(_e){ return ''; }
  }
  var _swrDbP = null;
  function _swrDb(){
    if (_swrDbP) return _swrDbP;
    _swrDbP = new Promise(function(res){
      try { var rq = indexedDB.open('mkids_swr', 1);
        rq.onupgradeneeded = function(){ try { rq.result.createObjectStore('r'); } catch(_e){} };
        rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ res(null); }; rq.onblocked = function(){ res(null); };
      } catch(_e){ res(null); }
    });
    return _swrDbP;
  }
  function _swrGet(k){ return _swrDb().then(function(db){ if (!db) return null; return new Promise(function(res){
    try { var q = db.transaction('r').objectStore('r').get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }
    catch(_e){ res(null); } }); }); }
  function _swrPut(k, v){ _swrDb().then(function(db){ if (!db) return; try { db.transaction('r', 'readwrite').objectStore('r').put(v, k); } catch(_e){} }); }
  var _swrFreshActs = {}, _swrFreshTmr = 0;
  function _swrFresh(act){
    _swrFreshActs[act] = 1; clearTimeout(_swrFreshTmr);
    _swrFreshTmr = setTimeout(function(){
      var acts = Object.keys(_swrFreshActs); _swrFreshActs = {};
      var ev; try { ev = new CustomEvent('mkids:fresh', {detail: {actions: acts}, cancelable: true}); } catch(_e){ return; }
      if (window.dispatchEvent(ev) === false) return;          // сторінка оновилась сама
      if (document.getElementById('mkSwrToast')) return;
      var d = document.createElement('div'); d.id = 'mkSwrToast';
      d.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;background:#1f2d3d;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);font:13px/1.3 system-ui,sans-serif;display:flex;gap:10px;align-items:center';
      d.innerHTML = '🔄 Є свіжіші дані <button style="background:#27ae60;color:#fff;border:0;border-radius:7px;padding:5px 10px;cursor:pointer;font-weight:700">Оновити</button><span style="cursor:pointer;opacity:.7;padding:0 4px">✕</span>';
      d.querySelector('button').onclick = function(){ location.reload(); };
      d.querySelector('span').onclick = function(){ d.remove(); };
      (document.body || document.documentElement).appendChild(d);
    }, 800);
  }
  window.fetch = function(input, init){
    var url = '';
    try { url = (typeof input === 'string') ? input : (input && input.url) || ''; } catch(_e){}
    if (url.indexOf('script.google.com') < 0) return _of(input, init);   // сторонні запити не чіпаємо
    if (!_checkTok()) return new Promise(function(){});                    // v7.288: кинуто на логін — запит не шлемо
    try {
      var t = _tok();
      if (t){
        init = init || {};
        var m = ((init && init.method) || 'GET').toUpperCase();
        if (m === 'POST'){
          if (typeof init.body === 'string'){ try { var b = JSON.parse(init.body); if (b && b.token == null){ b.token = t; init.body = JSON.stringify(b); } } catch(_e){} }
        } else if (typeof input === 'string' && !/[?&]token=/.test(input)){
          input = input + (input.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(t);
        }
      }
    } catch(_e){}
    // v7.403 МИТТЄВЕ ВІДКРИТТЯ (stale-while-revalidate): важкі запити на читання відповідають одразу з кешу
    //   браузера (IndexedDB, окремо для кожного користувача, до доби), а свіжа відповідь тягнеться у фоні.
    //   Змінилась — подія 'mkids:fresh' (дашборд перемальовується сам, на інших сторінках — кнопка «Оновити»).
    //   Після будь-якого запису (POST) 90 с кеш не віддається — щоб після збереження не блимали старі дані.
    var _swrM = ((init && init.method) || 'GET').toUpperCase();
    if (_swrM === 'POST'){ try { localStorage.setItem('mkids_swr_dirty', String(Date.now() + 90000)); } catch(_e){} }
    var _swrAct = (typeof input === 'string') ? ((/[?&]action=([^&]+)/.exec(input) || [])[1] || '') : '';
    if (_swrM === 'GET' && SWR_ACTIONS[_swrAct] && !/[?&]nocache=1/.test(input) && window.indexedDB){
      var _swrK = _swrKey(input);
      if (_swrK){
        var _in = input, _it = init;
        return _swrGet(_swrK).then(function(c){
          var dirty = false; try { dirty = Date.now() < Number(localStorage.getItem('mkids_swr_dirty') || 0); } catch(_e){}
          var net = function(served){
            return _of(_in, _it).then(_watch).then(function(r){
              try { r.clone().text().then(function(t){ try { var j = JSON.parse(t);
                if (j && j.ok !== false){ _swrPut(_swrK, {body: t, ts: Date.now()}); if (served && c && c.body !== t) _swrFresh(_swrAct); }
              } catch(_e){} }); } catch(_e){}
              return r; });
          };
          if (c && c.body && !dirty && Date.now() - c.ts < 86400000){
            if (Date.now() - c.ts > 15000) net(true).catch(function(){});
            return new Response(c.body, {status: 200, headers: {'Content-Type': 'application/json'}});
          }
          return net(false);
        });
      }
    }
    // v7.401: getLocations — спільний кеш у браузері на 30 хв для всіх сторінок (було ~8 с на кожному старті)
    if (typeof input === 'string' && /[?&]action=getLocations(&|$)/.test(input) && !/[?&]nocache=1/.test(input)
        && ((init && init.method) || 'GET').toUpperCase() === 'GET'){
      try { var _lc = JSON.parse(localStorage.getItem('mkids_locs_cache') || 'null');
        if (_lc && _lc.body && Date.now() - _lc.ts < 1800000)
          return Promise.resolve(new Response(_lc.body, {status: 200, headers: {'Content-Type': 'application/json'}})); } catch(_e){}
      return _of(input, init).then(_watch).then(function(r){
        try { r.clone().text().then(function(t){ try { var j = JSON.parse(t);
          if (j && j.ok !== false) localStorage.setItem('mkids_locs_cache', JSON.stringify({ts: Date.now(), body: t})); } catch(_e){} }); } catch(_e){}
        return r; });
    }
    return _of(input, init).then(_watch);
  };
  _checkTok();   // v7.288: і одразу при завантаженні сторінки
})();
var CFG = { SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyTSUVlaN4-PpXe47zCSmhVs0Qxy1FDXG_XsB4zcKNpqBxdhDtS9ibM4YFGkGjmPQDFWQ/exec' };
var MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
              'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── session (shared) ──
var SESSION_KEY='mkids_session', SESSION_TTL_MS = 7 * 24 * 3600 * 1000;
function readSession(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.user||!s.t) return null;
    if(Date.now()-s.t>SESSION_TTL_MS) return null;
    s.user.role=String(s.user.role||'').toLowerCase().trim();
    return s.user;
  }catch(e){ return null; }
}

function _pctClass(p){ return p>=80?'hi':(p>=40?'mid':'lo'); }

function renderReport(j){
  var rep=j.report||[], tot=j.total||{kids:0,emailSent:0,viberSent:0,errors:0,emailPct:0,viberPct:0};
  if(!rep.length){ $('repWrap').innerHTML='<div class="empty">Немає даних за обраний період.</div>'; return; }
  function row(x, isTotal){
    var ep=x.emailPct||0, vp=x.viberPct||0;
    return '<tr'+(isTotal?' class="total"':'')+'>'+
      '<td>'+escapeHtml(x.loc)+'</td>'+
      '<td class="num">'+(x.kids||0)+'</td>'+
      '<td class="num">'+(x.emailSent||0)+' <span class="pct '+_pctClass(ep)+'">'+ep+'%</span>'+
        (isTotal?'':'<div class="bar"><span style="width:'+Math.min(ep,100)+'%"></span></div>')+'</td>'+
      '<td class="num">'+(x.viberSent||0)+' <span class="pct '+_pctClass(vp)+'">'+vp+'%</span>'+
        (isTotal?'':'<div class="bar"><span style="width:'+Math.min(vp,100)+'%"></span></div>')+'</td>'+
      '<td class="num">'+(x.errors||0)+'</td>'+
    '</tr>';
  }
  var html='<table><thead><tr>'+
    '<th>Локація</th><th class="num">Дітей</th>'+
    '<th class="num">📧 Email надіслано</th><th class="num">💬 Viber надіслано</th>'+
    '<th class="num">❌ Помилок</th>'+
    '</tr></thead><tbody>';
  rep.forEach(function(x){ html+=row(x,false); });
  html+=row(tot,true);
  html+='</tbody></table>';
  $('repWrap').innerHTML=html;
}

async function loadReport(){
  var m=Number($('fMonth').value)||0, y=Number($('fYear').value)||0;
  $('repWrap').innerHTML='<div class="loading"><div class="spinner"></div><div>Завантаження…</div></div>';
  $('meta').textContent=(m?MONTHS[m-1]+' ':'усі місяці ')+(y||'');
  try{
    var url=CFG.SCRIPT_URL+'?action=getInvoiceStatusReport&month='+m+'&year='+y;
    var r=await fetch(url,{redirect:'follow'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'failed');
    renderReport(j);
  }catch(e){
    $('repWrap').innerHTML='<div class="empty">❌ Помилка: '+escapeHtml(String(e&&e.message||e))+'</div>';
  }
}

function initFilters(){
  var mh='<option value="0">— усі —</option>';
  for(var i=0;i<12;i++) mh+='<option value="'+(i+1)+'">'+MONTHS[i]+'</option>';
  $('fMonth').innerHTML=mh;
  var cy=new Date().getFullYear(), yh='';
  for(var y=cy-1;y<=cy+1;y++) yh+='<option value="'+y+'">'+y+'</option>';
  $('fYear').innerHTML=yh;
  $('fMonth').value=new Date().getMonth()+1;
  $('fYear').value=cy;
}

(function boot(){
  var u=readSession();
  if(!u){ window.location.href='index.html'; return; }
  // доступ лише CFO/HR (ролі hr/cfo)
  var role=String(u.role||'').toLowerCase();
  if(role!=='hr' && role!=='cfo'){
    $('errBox').textContent='Доступ лише для CFO/HR.';
    $('errBox').classList.remove('hidden');
    $('repWrap').innerHTML='';
    return;
  }
  initFilters();
  loadReport();
})();
</script>
</body>
</html>
